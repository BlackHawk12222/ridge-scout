<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridge Scout · 56721K</title>
<meta name="theme-color" content="#0b0b0c">
<style>
:root{--bg:#0b0b0c;--card:#16161a;--line:#26262c;--tx:#f2f2f4;--mut:#8b8b95;--acc:#5b8cff;--good:#2fbf71;--red:#ff5d5d;--blue:#4c8dff;--star:#ffc23d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 16px calc(10px)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
h1{font-size:19px;margin:0;letter-spacing:-.2px}.sub{color:var(--mut);font-size:12.5px}
main{max-width:860px;margin:0 auto;padding:14px 14px 80px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
input,textarea{width:100%;background:#0f0f12;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px;font:inherit}
textarea{min-height:64px;resize:vertical}
input:disabled,textarea:disabled{opacity:.85}
section{margin:16px 0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.match{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px 12px}
.mq{font-weight:700}.mt{color:var(--mut);font-size:12px}
.al{display:flex;gap:6px;flex-wrap:wrap}.tm{font-size:13px;padding:3px 8px;border-radius:7px;cursor:pointer}
.r{background:rgba(255,93,93,.14);color:#ffb3b3}.b{background:rgba(76,141,255,.15);color:#b7cfff}.us{outline:1.5px solid var(--tx);font-weight:700}
.vs{color:var(--mut);font-size:12px;align-self:center}
.th{display:flex;align-items:center;gap:10px}.tn{font-size:18px;font-weight:700}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;font-size:22px;line-height:1;color:#3a3a42;cursor:pointer;padding:0 1px}
.stars button.on{color:var(--star)}.stars button:disabled{cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag{font-size:12.5px;padding:5px 10px}
.pick{font-size:12.5px}.pick.on{background:var(--good);border-color:var(--good)}
.meta{color:var(--mut);font-size:12px;margin-top:6px}
.nexts{color:var(--mut);font-size:12px}
.status{font-size:12px;color:var(--mut)}.status.ok{color:var(--good)}.status.err{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{width:100%;max-width:380px}
.hidden{display:none!important}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:140px}
.banner{font-size:13px;color:var(--mut);padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.evsel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;max-width:200px}
.big .card{max-width:520px}.mono{font:12.5px/1.45 ui-monospace,Menlo,monospace;min-height:120px}
label.lb{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.file{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;display:block}
</style>
</head>
<body>
<header>
  <div class="row">
    <div><h1>Ridge Scout</h1><div class="sub" id="evSub">56721K</div></div>
    <div class="sp"></div>
    <span id="status" class="status">Loading…</span>
    <button id="authBtn" class="btn ghost">Sign in</button>
  </div>
  <div class="tools">
    <select id="evSel" class="evsel"></select><button class="pill hidden" id="newEv">+ Event</button><input id="q" placeholder="Search team, tag, or note">
    <button class="pill" id="sortBtn">Sort: schedule</button>
    <button class="pill" id="pickOnly">Would pick</button>
  </div>
</header>
<main>
  <div id="viewNote" class="banner">View only. Archer's notes update here live.</div>
  <section id="matchSec"><h2>Our matches</h2><div id="matches"></div></section>
  <section><h2>Teams</h2><div id="teams"></div>
    <div id="addWrap" class="card hidden"><div class="row"><input id="newTeam" placeholder="Add a team (e.g. 1234A)"><button class="btn" id="addTeam">Add</button></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="card">
  <h2 style="margin-bottom:10px">Archer sign-in</h2>
  <div id="step1"><input id="email" type="email" value="archerandorjohnson@gmail.com" autocomplete="email"><div class="tools"><button class="btn" id="sendCode">Email me a sign-in link</button><button class="btn ghost" id="cancel1">Cancel</button></div></div>
  <div id="step2" class="hidden"><div class="meta" style="margin-bottom:8px">Check your email and tap the sign-in link on this device. If the email shows a code instead, type it here.</div><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code"><div class="tools"><button class="btn" id="verify">Sign in</button><button class="btn ghost" id="cancel2">Cancel</button></div></div>
  <div id="authMsg" class="status" style="margin-top:8px"></div>
</div></div>

<div class="modal big" id="evModal"><div class="card">
  <h2 style="margin-bottom:6px">New event</h2>
  <label class="lb">Event name</label><input id="evName" placeholder="e.g. Grand Forks Dec 12">
  <label class="lb">Our team</label><input id="evUs" value="56721K">
  <label class="lb">Schedule or team list photos (optional, add as many as you want)</label>
  <label class="file" for="evFile" id="fileLbl">Tap to add a photo</label><input id="evFile" type="file" accept="image/*" multiple class="hidden">
  <div id="ocrMsg" class="status" style="margin-top:6px"></div>
  <label class="lb">Matches (one per line: Q8 10:11 AM | red red | blue blue) — fix anything misread</label>
  <textarea id="evMatches" class="mono" placeholder="Q8 10:11 AM | 56721K 11532D | 56549B 59936A"></textarea>
  <label class="lb">Teams (space or line separated)</label>
  <textarea id="evTeams" class="mono" style="min-height:70px"></textarea>
  <div class="tools"><button class="btn" id="evSave">Create event</button><button class="btn ghost" id="evCancel">Cancel</button></div>
  <div id="evMsg" class="status" style="margin-top:6px"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://mtcfiumybawwwcioawyv.supabase.co";
const SUPA_KEY = "sb_publishable_Z_WT3N7VKT3wGLj0slXaaA_ndnqSf5P";
const OWNER = "archerandorjohnson@gmail.com";
const TAGS = ["Fast drive","Strong auton","Good intake","High scorer","Defense","Consistent","Good driver","Breaks down","Endgame"];
const DEFAULT_EV = { id:"fisher-2026", name:"Fisher · Nov 14, 2026", us:"56721K", created:"2026-11-14T08:00:00Z", teams:[], matches:[
  ["Q8","10:11 AM",["56721K","11532D"],["56549B","59936A"]],
  ["Q16","10:50 AM",["9821G","56721A"],["81207F","56721K"]],
  ["Q21","11:15 AM",["56549E","56721K"],["11532J","9821F"]],
  ["Q39","12:45 PM",["96671H","30029B"],["56721K","5450C"]],
  ["Q48","1:30 PM",["56721K","5450D"],["11532R","1532C"]],
  ["Q55","2:05 PM",["11532H","11532A"],["56721K","56549A"]],
  ["Q64","2:50 PM",["81207E","59936B"],["9821A","56721K"]],
]};

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
let events = {};   // id -> meta
let notes = {};    // id -> team -> {rating,tags,pick,note,updated_at}
let cur = null, owner = false, sortMode = "schedule", pickOnly = false;
const timers = {};
const $ = id => document.getElementById(id);
const blank = () => ({rating:0,tags:[],pick:false,note:""});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ev = () => events[cur];
function setStatus(t, cls=""){ const s=$("status"); s.textContent=t; s.className="status "+cls; }

function ingest(r){
  if (r.team.startsWith("ev:")) { events[r.team.slice(3)] = {...r.data, id:r.team.slice(3), saved:true}; }
  else if (r.team.startsWith("t:")) { const [, id, ...rest] = r.team.split(":"); const t = rest.join(":");
    (notes[id] = notes[id]||{})[t] = {...blank(), ...r.data, updated_at:r.updated_at}; }
}

function teamOrder(e){
  const o=[]; (e.matches||[]).forEach(m=>[...m[2],...m[3]].forEach(t=>{ if(t!==e.us && !o.includes(t)) o.push(t); }));
  const rest=[...(e.teams||[]), ...Object.keys(notes[e.id]||{})].filter(t=>t!==e.us && !o.includes(t));
  return [...o, ...[...new Set(rest)].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b))];
}
function nextMatch(e,t){
  for (const m of e.matches||[]){ const ours=m[2].includes(e.us)?m[2]:m[3].includes(e.us)?m[3]:null; if(!ours) continue;
    if (ours.includes(t)) return m[0]+" "+m[1]+" · with us"; if ([...m[2],...m[3]].includes(t)) return m[0]+" "+m[1]+" · against us"; }
  return "";
}

function renderEvSel(){
  const list = Object.values(events).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  $("evSel").innerHTML = list.map(e=>`<option value="${esc(e.id)}" ${e.id===cur?"selected":""}>${esc(e.name)}</option>`).join("");
  $("evSub").textContent = ev() ? ev().us+" · "+ev().name : "";
}
function renderMatches(){
  const e=ev(); const ms=(e.matches||[]).filter(m=>[...m[2],...m[3]].includes(e.us));
  $("matchSec").classList.toggle("hidden", !ms.length);
  $("matches").innerHTML = ms.map(m => {
    const tm=(arr,c)=>arr.map(t=>`<span class="tm ${c} ${t===e.us?"us":""}" data-jump="${esc(t)}">${esc(t)}</span>`).join("");
    return `<div class="card match"><div><div class="mq">${esc(m[0])}</div><div class="mt">${esc(m[1]||"")}</div></div><div class="al">${tm(m[2],"r")}<span class="vs">vs</span>${tm(m[3],"b")}</div></div>`;
  }).join("");
}
function teamList(){
  const e=ev(), data=notes[e.id]||{}, q=$("q").value.trim().toLowerCase();
  let list = teamOrder(e).filter(t=>{ const d=data[t]||blank(); if(pickOnly&&!d.pick) return false; if(!q) return true;
    return t.toLowerCase().includes(q)||(d.note||"").toLowerCase().includes(q)||(d.tags||[]).some(g=>g.toLowerCase().includes(q)); });
  if (sortMode==="rating") list.sort((a,b)=>((data[b]||{}).rating||0)-((data[a]||{}).rating||0));
  return list;
}
function renderTeams(){
  const e=ev(), data=notes[e.id]||{}, dis=owner?"":"disabled";
  $("teams").innerHTML = teamList().map(t => {
    const d=data[t]||blank();
    const stars=[1,2,3,4,5].map(n=>`<button ${dis} class="${n<=d.rating?"on":""}" data-star="${esc(t)}" data-n="${n}">★</button>`).join("");
    const tags=TAGS.map(g=>`<button ${dis} class="pill tag ${d.tags.includes(g)?"on":""}" data-tag="${esc(t)}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
    const when=d.updated_at?"Updated "+new Date(d.updated_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";
    return `<div class="card" id="t-${esc(t)}"><div class="th"><span class="tn">${esc(t)}</span><div class="stars">${stars}</div><div class="sp"></div><button ${dis} class="pill pick ${d.pick?"on":""}" data-pick="${esc(t)}">${d.pick?"✓ Would pick":"Would pick"}</button></div>
      <div class="nexts">${nextMatch(e,t)}</div><div class="tags">${tags}</div>
      <textarea ${dis} data-note="${esc(t)}" placeholder="${owner?"Notes":"No notes yet"}">${esc(d.note||"")}</textarea><div class="meta">${when}</div></div>`;
  }).join("") || `<div class="banner">No teams yet.</div>`;
}
function render(){ renderEvSel(); renderMatches(); renderTeams();
  $("viewNote").classList.toggle("hidden",owner); $("addWrap").classList.toggle("hidden",!owner); $("newEv").classList.toggle("hidden",!owner);
  $("authBtn").textContent = owner?"Sign out":"Sign in"; }

function pickCur(){
  const h = decodeURIComponent((location.hash.match(/ev=([^&]+)/)||[])[1]||"");
  if (h && events[h]) cur=h;
  if (!cur || !events[cur]) cur = Object.values(events).sort((a,b)=>(b.created||"").localeCompare(a.created||""))[0].id;
}
async function load(){
  const { data: rows, error } = await sb.from("scout").select("*");
  if (error){ setStatus("Can't reach cloud","err"); return false; }
  rows.forEach(ingest);
  if (!Object.keys(events).length) events[DEFAULT_EV.id] = {...DEFAULT_EV};
  pickCur(); setStatus(owner?"Editing":"Live","ok"); render(); return true;
}

async function saveMeta(id){
  const m={...events[id]}; delete m.saved; delete m.id;
  const { error } = await sb.from("scout").upsert({team:"ev:"+id, data:m, updated_at:new Date().toISOString()});
  if (!error) events[id].saved=true; return error;
}
function queueSave(t){
  if (!owner) return; const id=cur, key=id+":"+t; setStatus("Saving…"); clearTimeout(timers[key]);
  timers[key]=setTimeout(async()=>{
    if (!events[id].saved){ const er=await saveMeta(id); if(er){ setStatus("Not saved, retrying","err"); setTimeout(()=>queueSave(t),3000); return; } }
    const d={...notes[id][t]}; delete d.updated_at;
    const { error } = await sb.from("scout").upsert({team:`t:${id}:${t}`, data:d, updated_at:new Date().toISOString()});
    delete timers[key];
    if (error){ setStatus("Not saved, retrying","err"); setTimeout(()=>queueSave(t),3000); } else setStatus("Saved","ok");
  },500);
}
function edit(t,fn){ const n=notes[cur]=notes[cur]||{}; n[t]=n[t]||blank(); fn(n[t]); queueSave(t); }

document.addEventListener("click", e => {
  const el=e.target.closest("button,[data-jump]"); if(!el) return;
  if (el.dataset.jump){ const c=$("t-"+el.dataset.jump); if(c) c.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  if (!owner) return;
  if (el.dataset.star){ const t=el.dataset.star,n=+el.dataset.n; edit(t,d=>d.rating=d.rating===n?0:n); renderTeams(); }
  else if (el.dataset.tag){ const t=el.dataset.tag,g=el.dataset.g; edit(t,d=>d.tags=d.tags.includes(g)?d.tags.filter(x=>x!==g):[...d.tags,g]); renderTeams(); }
  else if (el.dataset.pick){ const t=el.dataset.pick; edit(t,d=>d.pick=!d.pick); renderTeams(); }
});
document.addEventListener("input", e => { const t=e.target.dataset.note; if(t&&owner) edit(t,d=>d.note=e.target.value); });
$("q").oninput=renderTeams;
$("evSel").onchange=()=>{ cur=$("evSel").value; location.hash="ev="+encodeURIComponent(cur); render(); };
$("sortBtn").onclick=()=>{ sortMode=sortMode==="schedule"?"rating":"schedule"; $("sortBtn").textContent="Sort: "+sortMode; renderTeams(); };
$("pickOnly").onclick=()=>{ pickOnly=!pickOnly; $("pickOnly").classList.toggle("on",pickOnly); renderTeams(); };
$("addTeam").onclick=()=>{ const t=$("newTeam").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8); if(!t) return; edit(t,()=>{}); $("newTeam").value=""; renderTeams(); };

// ---------- new event + photo reading ----------
const TEAM_RE=/\b\d{1,5}[A-Z]\b/g;
function fixOcr(line){ return line.toUpperCase()
  .replace(/(\d)O(?=\d)/g,"$10").replace(/\bO(?=\d)/g,"0")
  .replace(/\b(\d{3,5})[)\]]/g,"$1J").replace(/\b(\d{3,5})[|!]/g,"$1I").replace(/[|]/g," "); }
// Reads VEX Via / RobotEvents style schedules. Handles both layouts:
//  one line per match (Q8 10:11 AM r1 r2 b1 b2) and stacked rows
//  (Q8 r1 UND b1 / 10:11 AM r2 b2), where each line's first team is red, last is blue.
function parseText(text){
  const raw=text.split(/\n+/).filter(l=>l.trim()), lines=raw.map(fixOcr);
  const teams=new Set(), matches=[]; let us="", name="", m=null;
  const flush=()=>{ if(m && (m[2].length||m[3].length)) matches.push(m); m=null; };
  lines.forEach((line,i)=>{
    const ts=line.match(TEAM_RE)||[];
    const hdr=line.match(/(\d{1,5}[A-Z])\s*[-–]\s*[A-Z]{2,}/); if(hdr && !us) { us=hdr[1]; return; }
    const at=raw[i].match(/^\s*@\s*(.+)$/); if(at && !name){ name=at[1].trim(); return; }
    ts.forEach(t=>teams.add(t));
    const q=line.match(/\b(QF|SF|R16|F|Q|QUAL(?:IFICATION|IFIER)?)\s*#?\s*(\d{1,3})\b(?!:)/);
    const tm=line.match(/\b(\d{1,2}:\d{2})\s*(AM|PM)?/);
    if(q){ flush(); m=[(q[1].startsWith("QUAL")?"Q":q[1])+q[2], tm?tm[1]+(tm[2]?" "+tm[2]:""):"", [], []];
      if(ts.length>=4){ const h=Math.ceil(ts.length/2); m[2]=ts.slice(0,h); m[3]=ts.slice(h); flush(); return; } }
    else if(!m) return;
    if(!m[1] && tm) m[1]=tm[1]+(tm[2]?" "+tm[2]:"");
    if(ts.length===1) m[2].push(ts[0]);
    else if(ts.length>=2){ m[2].push(ts[0]); m[3].push(ts[ts.length-1]); }
    if(m[2].length>=2 && m[3].length>=2) flush();
  });
  flush();
  return {matches, teams:[...teams], us, name};
}
// make phone screenshots (light text on dark) readable: grayscale, invert if dark, upscale 2x
function prep(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{
  const k=img.width<1400?2:1, c=document.createElement("canvas"); c.width=img.width*k; c.height=img.height*k;
  const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height); const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  let sum=0; for(let i=0;i<p.length;i+=4){ const g=.299*p[i]+.587*p[i+1]+.114*p[i+2]; p[i]=p[i+1]=p[i+2]=g; sum+=g; }
  if(sum/(p.length/4)<128) for(let i=0;i<p.length;i+=4){ p[i]=p[i+1]=p[i+2]=255-p[i]; }
  x.putImageData(d,0,0); c.toBlob(res,"image/png"); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
const fmtMatch=m=>`${m[0]} ${m[1]} | ${m[2].join(" ")} | ${m[3].join(" ")}`.replace(/\s+\|/g," |");
function readMatchBox(){
  return $("evMatches").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split("|"); const head=parts[0].trim().split(/\s+/); const id=head.shift()||"";
    const toT=s=>((s||"").toUpperCase().match(TEAM_RE)||[]);
    return [id, head.join(" "), toT(parts[1]), toT(parts[2])];
  }).filter(m=>m[0]&&(m[2].length||m[3].length));
}
$("newEv").onclick=()=>{ ["evName","evMatches","evTeams"].forEach(i=>$(i).value=""); $("evMsg").textContent=""; $("ocrMsg").textContent=""; $("fileLbl").textContent="Tap to add a photo"; $("evModal").style.display="flex"; };
$("evCancel").onclick=()=>$("evModal").style.display="none";
$("evUs").oninput=()=>$("evUs").dataset.touched="1";
$("evFile").onchange=async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  for (const [i,f] of files.entries()){
    $("ocrMsg").textContent=`Reading photo ${i+1} of ${files.length}…`;
    try{
      const w=await Tesseract.createWorker("eng",1,{logger:m=>{ if(m.status==="recognizing text") $("ocrMsg").textContent=`Reading photo ${i+1} of ${files.length}… ${Math.round(m.progress*100)}%`; }});
      await w.setParameters({tessedit_pageseg_mode:"6"});
      const r=await w.recognize(await prep(f)); await w.terminate();
      const p=parseText(r.data.text);
      const haveM=new Set(readMatchBox().map(m=>m[0]));
      const addM=p.matches.filter(m=>!haveM.has(m[0])).map(fmtMatch);
      if(addM.length) $("evMatches").value=($("evMatches").value.trim()+"\n"+addM.join("\n")).trim();
      const tset=new Set(($("evTeams").value.toUpperCase().match(TEAM_RE)||[])); p.teams.forEach(t=>tset.add(t));
      $("evTeams").value=[...tset].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b)).join(" ");
      if(p.us && !$("evUs").dataset.touched) $("evUs").value=p.us;
      if(p.name && !$("evName").value.trim()) $("evName").value=p.name;
      $("ocrMsg").textContent=`Found ${p.matches.length} matches and ${p.teams.length} teams. Check them below.`;
    }catch(err){ $("ocrMsg").textContent="Couldn't read that photo. Type the teams in instead."; }
  }
  $("fileLbl").textContent="Add another photo"; e.target.value="";
};
$("evSave").onclick=async()=>{
  const name=$("evName").value.trim(); if(!name){ $("evMsg").textContent="Name the event first."; return; }
  const us=($("evUs").value.toUpperCase().match(TEAM_RE)||["56721K"])[0];
  const matches=readMatchBox();
  const teams=[...new Set([...($("evTeams").value.toUpperCase().match(TEAM_RE)||[]), ...matches.flatMap(m=>[...m[2],...m[3]])])].filter(t=>t!==us);
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+"-"+Date.now().toString(36).slice(-4);
  events[id]={id,name,us,matches,teams,created:new Date().toISOString()};
  $("evMsg").textContent="Saving…";
  const er=await saveMeta(id);
  if(er){ $("evMsg").textContent="Couldn't save: "+er.message; delete events[id]; return; }
  $("evModal").style.display="none"; cur=id; location.hash="ev="+encodeURIComponent(id); render(); setStatus("Saved","ok");
};

// ---------- auth ----------
const modal=$("modal");
$("authBtn").onclick=async()=>{ if(owner){ await sb.auth.signOut(); return; } $("step1").classList.remove("hidden"); $("step2").classList.add("hidden"); $("authMsg").textContent=""; modal.style.display="flex"; };
$("cancel1").onclick=$("cancel2").onclick=()=>modal.style.display="none";
$("sendCode").onclick=async()=>{ $("authMsg").textContent="Sending…";
  const { error }=await sb.auth.signInWithOtp({email:$("email").value.trim(),options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  if(error){ $("authMsg").textContent=error.message; return; }
  $("authMsg").textContent=""; $("step1").classList.add("hidden"); $("step2").classList.remove("hidden"); $("code").focus(); };
$("verify").onclick=async()=>{ $("authMsg").textContent="Checking…";
  const { error }=await sb.auth.verifyOtp({email:$("email").value.trim(),token:$("code").value.trim(),type:"email"});
  if(error){ $("authMsg").textContent=error.message; return; } modal.style.display="none"; };
sb.auth.onAuthStateChange((_e,session)=>{ owner=!!(session&&session.user&&(session.user.email||"").toLowerCase()===OWNER);
  setStatus(owner?"Editing":"Live","ok"); if(cur) render(); });

// ---------- live updates ----------
sb.channel("scout").on("postgres_changes",{event:"*",schema:"public",table:"scout"},p=>{
  const r=p.new; if(!r||!r.team) return;
  if (r.team.startsWith("t:")){ const [,id,...rest]=r.team.split(":"); if(owner&&timers[id+":"+rest.join(":")]) return; }
  ingest(r); if(!events[cur]) pickCur();
  if(!(owner&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.note)) render(); else renderEvSel();
}).subscribe();
setInterval(()=>{ if(!owner) load(); },20000);
window.addEventListener("hashchange",()=>{ pickCur(); render(); });
load();
</script>
</body>
</html>
